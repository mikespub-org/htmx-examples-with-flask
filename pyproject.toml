[project]
name = "htmx-examples-with-flask"
version = "0.2.0"
description = "My implementation of the htmx examples from the official website, using Flask."
authors = [
    { name = "Konfuzian" }
]
readme = "README.md"
packages = [{include = "examples"}]
requires-python = '>=3.11,<4.0'
dependencies = ['click (>=8.1.7,<9.0.0)', 'flask (>=2.3.3,<3.0.0)', 'flask-htmx (>=0.3.2,<0.4.0)', 'jinja2-fragments (>=1.6.0,<2.0.0)']

[tool.poetry]
requires-poetry = '>=2.0,<3.0'
[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.0.290"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[project.scripts]
server = "examples.app:main"

[tool.black]
line-length = 88
target-version = ["py311",]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "F",    # pyflakes
    "E",    # pycodestyle Error
    "W",    # pycodestle Warning
    "I",    # isort
    "B",    # bugbear
    "C90",  # mccabe
    "N",    # pep8-naming
]
